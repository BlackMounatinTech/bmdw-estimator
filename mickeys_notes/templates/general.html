<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="app-base" content="{{ request.script_root }}"><meta name="csrf" content="{{ csrf }}">
<title>General to-do · Mickey’s Notes</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f7f8f5">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=general-1">
</head><body>
<header class="app-header"><a href="{{ url_for('index') }}">Mickey’s notes</a><nav class="top-nav" aria-label="Lists"><a href="{{ url_for('index') }}">Days</a><a href="{{ url_for('general_page') }}" aria-current="page">General to-do</a></nav><span id="save-status" role="status">Loading…</span></header>
<main class="general-page" id="general-page" inert>
<div class="day-heading"><h1>General to-do</h1><span id="general-progress"></span></div>
<p class="general-hint">For any day. New tasks stay at the top; checked tasks move to the bottom.</p>
<div class="capture"><textarea id="general-capture" aria-label="Type or dictate general tasks" placeholder="What do you need to do?" rows="3"></textarea>
<div class="capture-actions"><button id="general-dictate" type="button">🎙 Dictate</button><button id="general-add" class="primary" type="button">Add to list</button></div>
<p id="voice-status" role="status">You can also use your keyboard’s microphone.</p></div>
<div id="general-tasks"></div>
</main><p id="error" role="alert" hidden></p>
<script src="{{ url_for('static', filename='general.js') }}?v=general-1"></script>
</body></html>
