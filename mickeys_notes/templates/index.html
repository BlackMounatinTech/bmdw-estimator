<!doctype html>
<html lang="en">
<head>
  <meta name="app-base" content="{{ request.script_root }}">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf" content="{{ csrf }}">
  <title>Mickey’s Notes</title>
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mickey’s Notes"><meta name="theme-color" content="#f7f8f5"><link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.png') }}"><link rel="icon" href="{{ url_for('static', filename='icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=move-general-1">
</head>
<body>
  <header class="app-header"><a href="{{ url_for('index') }}">Mickey’s notes</a><nav class="top-nav" aria-label="Lists"><a href="{{ url_for('index') }}" aria-current="page">Days</a><a href="{{ url_for('general_page') }}">General to-do</a></nav><span id="save-status" role="status">Loading…</span></header>
  <main class="layout">
    <aside class="calendar-panel" aria-label="Calendar">
      <div class="month-navigation">
        <button id="previous-month" class="icon" aria-label="Previous month">‹</button>
        <h2 id="month-title"></h2>
        <button id="next-month" class="icon" aria-label="Next month">›</button>
      </div>
      <div class="weekdays" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
      <div id="calendar" class="calendar-grid" aria-label="Choose a day"></div>
      <button id="today" class="today-button">Today</button>
    </aside>
    <article id="day-page" inert>
      <div class="day-heading"><h1 id="day-title">Your day</h1><span id="day-year"></span></div>
        <div class="capture">
          <textarea id="capture" aria-label="Type or dictate your daily list" placeholder="Type or dictate your list. Pause between tasks." rows="3"></textarea>
          <div class="capture-actions"><button id="dictate" type="button">🎙 Dictate</button><button id="add-tasks" class="primary" type="button">Add to list</button></div>
          <p id="voice-status" role="status">You can also use your keyboard’s microphone.</p>
        </div>
      <div id="morning-routine" class="routines"></div>
      <section class="daily-list" aria-labelledby="list-title">
        <div class="section-heading"><h2 id="list-title">Daily list</h2><span id="progress"></span></div>
        <p class="general-hint" style="margin:0 0 8px">Hold a task to move it to General to-do.</p><div id="tasks"></div>
        <p class="priority-hint" id="priority-hint" hidden>☆ marks a priority.</p>
      </section>
      <div id="night-routine" class="routines evening-routine"></div>
    </article>
  </main>
  <p id="error" role="alert" hidden></p>
  <script src="{{ url_for('static', filename='task-drag.js') }}?v=carry-drag-1"></script>
  <script src="{{ url_for('static', filename='app.js') }}?v=move-general-1"></script>
</body>
</html>
