<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Move saved notes</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><body class="login"><form method="post" enctype="multipart/form-data"><h1>Move saved notes</h1><p>This only imports into an empty app. Existing entries will not be overwritten.</p>{% if message %}<p role="status">{{ message }}</p><a href="{{ url_for('index') }}">Open my notes</a>{% else %}<input type="hidden" name="csrf" value="{{ csrf }}"><label>Notes backup<input type="file" name="backup" accept="application/json,.json" required></label><button class="primary">Import saved notes</button>{% endif %}</form></body></html>
